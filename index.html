<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ritika — Raksha Bandhan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--cream:#eeeae2;
--ink:#171614;
--muted:#77736c;
--brown:#9c7761;
--line:rgba(23,22,20,.15);
--serif:"Playfair Display",serif;
--sans:"Manrope",sans-serif;
--mono:"DM Mono",monospace
}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.grain{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");mix-blend-mode:multiply}
.nav{height:80px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.nav-logo,.nav-date{font-family:var(--mono);font-size:10px;letter-spacing:.16em}
.hero{min-height:calc(100vh - 80px);padding:7vh 8vw 5vh;display:grid;grid-template-columns:1fr .75fr;align-items:center;gap:10vw}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:35px}
.eyebrow span{display:block;margin-top:6px}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(75px,11vw,170px);line-height:.82;letter-spacing:-.065em;margin-bottom:50px}
.hero-title em{display:block;font-weight:400;margin-left:13vw;color:var(--brown)}
.hero-description{max-width:380px;font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:45px}
.enter{display:inline-flex;align-items:center;gap:35px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;border-bottom:1px solid var(--ink);padding-bottom:9px;transition:.4s}
.enter:hover{gap:55px}
.hero-photo-wrap{position:relative}
.hero-photo{width:min(430px,100%);aspect-ratio:4/5;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.72);transition:1.2s}
.hero-photo:hover img{transform:scale(1.04)}
.photo-number{font-family:var(--mono);font-size:9px;position:absolute;top:-25px;right:0;color:var(--muted)}
.photo-caption{display:flex;justify-content:space-between;width:min(430px,100%);padding-top:13px;font-family:var(--mono);font-size:9px;letter-spacing:.1em}
.photo-caption span:last-child{color:var(--muted)}
.bottom-note{position:absolute;bottom:25px;left:5vw;right:5vw;display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;letter-spacing:.15em;color:var(--muted)}
.reveal{opacity:0;transform:translateY(30px);animation:reveal .9s cubic-bezier(.2,.7,.2,1) forwards}
.delay1{animation-delay:.12s}.delay2{animation-delay:.25s}.delay3{animation-delay:.4s}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@media(max-width:800px){
.nav{height:65px}
.hero{min-height:auto;padding:10vh 7vw 12vh;display:flex;flex-direction:column;align-items:flex-start;gap:80px}
.hero-title{font-size:20vw}
.hero-title em{margin-left:20vw}
.hero-photo-wrap,.hero-photo{width:100%}
.bottom-note{display:none}
}
</style>
</head>

<body>

<div class="grain"></div>

<nav class="nav">
<div class="nav-logo">R / R</div>
<div class="nav-date">AUG · 2026</div>
</nav>

<main class="hero">

<div>
<span class="eyebrow reveal">A little something,<br><span>from your brother.</span></span>

<h1 class="hero-title reveal delay1">
For
<em>Ritika.</em>
</h1>

<p class="hero-description reveal delay2">
Not another Raksha Bandhan message.
Just a small corner of the internet
made especially for you.
</p>

<a href="story.html" class="enter reveal delay3">
<span>ENTER</span>
<span>↗</span>
</a>
</div>

<div class="hero-photo-wrap reveal delay2">

<div class="photo-number">01 / 05</div>

<div class="hero-photo">
<img src="ritika.jpg" alt="Ritika">
</div>

<div class="photo-caption">
<span>RITIKA</span>
<span>my favourite headache.</span>
</div>

</div>

</main>

<div class="bottom-note">
<span>RAKSHA BANDHAN</span>
<span>SCROLL TO BEGIN ↓</span>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
document.body.classList.add("loaded");
});
</script>

</body>
</html>
